# Montes Ibéricos — TFG
# Configuración de conexión a Oracle y servidor

# Conexión a Oracle XE
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=admin_montes_ibericos
spring.datasource.password=MontesIbericos1998
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
# none = no toca las tablas (ya las tenemos creadas nosotros)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true

# Puerto del servidor
server.port=8080

# Email (configurar con tu cuenta cuando llegue el momento)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_EMAIL@gmail.com
spring.mail.password=TU_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true